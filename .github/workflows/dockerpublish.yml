name: Docker

on:
  push:
    branches:
      - main

concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04-arm
    outputs:
      revision: ${{ steps.version.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine release version
        id: version
        run: |
          MUSL_VERSION=$(awk '$1 == "MUSL_VER" && $2 == "=" { print $3; exit }' musl-cross-make/config.mak)
          test -n "$MUSL_VERSION"
          LAST_REVISION=$(git ls-remote --tags --refs origin | awk -v prefix="refs/tags/musl_${MUSL_VERSION}_" '
            index($2, prefix) == 1 {
              revision = substr($2, length(prefix) + 1)
              if (revision ~ /^[0-9]+$/ && revision + 0 > max) max = revision + 0
            }
            END { print max + 0 }
          ')
          echo "revision=musl_${MUSL_VERSION}_$((LAST_REVISION + 1))" >> "$GITHUB_OUTPUT"

  build-platforms:
    needs: prepare
    strategy:
      matrix:
        variant: [x86_64_musl, armv7_musl, arm64_musl]
        host: [arm64, amd64]
        include:
          - variant: x86_64_musl
            target: x86_64-unknown-linux-musl
          - variant: armv7_musl
            target: armv7-unknown-linux-musleabihf
          - variant: arm64_musl
            target: aarch64-linux-musl
          - host: arm64
            os: ubuntu-24.04-arm
          - host: amd64
            os: ubuntu-24.04

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log into registry
        env:
          CR_PAT: ${{ secrets.CR_PAT }}
        run: printf '%s\n' "$CR_PAT" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Expose GitHub Runtime
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Build and push image
        run: |
          IMAGE_ID=ghcr.io/chipp/build.musl.${{ matrix.variant }}

          echo IMAGE_ID=$IMAGE_ID

          docker buildx build . \
             --push \
             --platform linux/${{ matrix.host }} \
             --cache-from=type=gha,scope=${{ matrix.variant }}-${{ matrix.host }} \
             --cache-to=type=gha,scope=${{ matrix.variant }}-${{ matrix.host }},mode=max \
             --build-arg TARGET="${{ matrix.target }}" \
             --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
             --tag $IMAGE_ID:build-${{ github.run_id }}-linux-${{ matrix.host }}

  merge-multi-arch:
    runs-on: ubuntu-24.04-arm
    needs: [prepare, build-platforms]
    strategy:
      matrix:
        variant: [x86_64_musl, armv7_musl, arm64_musl]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log into registry
        env:
          CR_PAT: ${{ secrets.CR_PAT }}
        run: printf '%s\n' "$CR_PAT" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Merge and push
        run: |
          IMAGE_ID=ghcr.io/chipp/build.musl.${{ matrix.variant }}

          FULL_REVISION=${{ needs.prepare.outputs.revision }}

          echo IMAGE_ID=$IMAGE_ID
          echo FULL_REVISION=$FULL_REVISION

          docker buildx imagetools create \
             --tag $IMAGE_ID:$FULL_REVISION \
             --tag $IMAGE_ID:latest \
             $IMAGE_ID:build-${{ github.run_id }}-linux-amd64 \
             $IMAGE_ID:build-${{ github.run_id }}-linux-arm64

  create-tag:
    runs-on: ubuntu-24.04-arm
    needs: [prepare, merge-multi-arch]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log into registry
        env:
          CR_PAT: ${{ secrets.CR_PAT }}
        run: printf '%s\n' "$CR_PAT" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Create a tag
        run: |
          FULL_REVISION=${{ needs.prepare.outputs.revision }}

          git tag $FULL_REVISION HEAD
          git push origin $FULL_REVISION
